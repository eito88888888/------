<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080914" />
  <title>不死の村人</title>
  <link rel="stylesheet" href="style.css" />
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">IMMORTAL FABLE</p>
        <h1>不死の村人</h1>
      </div>
      <button id="soundButton" type="button">🔊</button>
    </header>
    <div class="hud">
      <div><span>心臓</span><strong id="heartCount">3</strong></div>
      <div><span>能力</span><strong id="abilityText">通常</strong></div>
      <div><span>進行</span><strong id="progressText">村</strong></div>
    </div>
    <div class="stage-warp">
      <label for="stageWarp">クリア済みステージへワープ</label>
      <select id="stageWarp"><option value="">クリア済みステージを選択</option></select>
      <button id="warpButton" type="button">ワープ</button>
    </div>
    <div id="game-root"></div>
    <p class="hint">← → 移動　↑ ジャンプ　スペース 身体を切離/再接続</p>
  </main>
</body>
</html>
